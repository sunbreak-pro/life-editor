appId: com.life-editor.app
productName: Life Editor

directories:
  output: release
# `buildResources` is intentionally absent. electron-builder defaults it to
# `build/`, which never existed here — every icon is pointed at ../resources
# explicitly (mac.icon / win.icon / linux.icon + extraResources), so there is
# nothing for a buildResources dir to hold. Declaring a path that does not
# exist only invites "why is this empty?" archaeology later.

# electron-vite output. The renderer is web/index.html bundled into out/renderer.
files:
  - out/**/*
  - package.json

# Ship the app icon into the packaged app's resources dir so the Tray can load
# it at runtime (process.resourcesPath/icon.png). In dev it is read from the
# repo's resources/ instead.
extraResources:
  - from: ../resources/icon.png
    to: icon.png

# Unsigned for Phase 1-5 ($0 policy). Signing/notarization is decided after
# completion (see migration SSOT §8). identity: null disables macOS code signing.
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.productivity
  identity: null
  icon: ../resources/icon.icns

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch:
        - x64
  # electron-builder converts the 1024px png into a multi-size .ico at build
  # time, keeping resources/icon.png the single icon source (same as linux).
  icon: ../resources/icon.png
  # Unsigned: SmartScreen "More info -> Run anyway" until a cert is purchased.

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Pinned explicitly so the release asset name is stable and matches the dmg
  # convention above. The default is "${productName} Setup ${version}.${ext}",
  # which carries no arch and drifts if electron-builder changes its default.
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Utility
  icon: ../resources/icon.png
