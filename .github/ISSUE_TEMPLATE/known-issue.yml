name: Known Issue
description: バグ / 構造的問題の記録
labels: ["type:bug"]
body:
  - type: input
    id: discovered
    attributes: { label: Discovered (YYYY-MM-DD) }
  - type: textarea
    id: symptom
    attributes: { label: Symptom, description: 症状。エラーは原文引用 }
    validations: { required: true }
  - type: textarea
    id: root_cause
    attributes: { label: Root Cause, description: 原因の本質（file:line） }
  - type: textarea
    id: impact
    attributes: { label: Impact }
  - type: textarea
    id: fix
    attributes: { label: Fix / Workaround }
  - type: input
    id: depends_on
    attributes:
      label: 依存する作業
      description: 先に origin/main へ入っている必要がある Issue を "#a, #b" の形で書く。無ければ "なし"。本文に直接書くときは 1 行で "依存する作業: #a, #b" と書く。close ではなく PR の着地で判定される（issue-prompter）
    validations: { required: true }
  - type: textarea
    id: references
    attributes: { label: References }
  - type: textarea
    id: lessons
    attributes: { label: Lessons Learned }
