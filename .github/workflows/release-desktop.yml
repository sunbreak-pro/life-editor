name: Release — desktop installers (unsigned)

# デスクトップの「配れる形」を作る唯一の経路（#1300 / #1301・計画書 =
# .claude/docs/vision/plans/2026-08-30-desktop-app-packaging.md）。
#
# ci.yml / deploy-web.yml との棲み分け:
#   ci.yml         … 壊れていないかの検証。PR ごとに走る。desktop は
#                    electron-vite build（バンドル）まで。electron-builder は
#                    意図的に回さない（NSIS が Linux ランナーで動かず、OS 別
#                    ランナーを PR ごとに回すのは分数の無駄 — #529）
#   deploy-web.yml … 公開 Web URL への配布
#   このファイル   … インストーラの生成 + GitHub Release（draft）への添付
#
# 起動条件は 2 つ:
#   push tag desktop-v*  … 本番の配布経路。release ジョブまで走って draft を作る
#   workflow_dispatch    … 手動の動作確認。ビルドと artifact までで止まり、
#                          Release は作らない（タグが無いので版が決まらない）
#
# 署名はしない（$0 原則 — 移行 SSOT §8）。未署名の代償は利用者側の初回起動
# 操作で、手順は desktop/README.md に書いてある。electron-updater は
# 有効化しない — 未署名バイナリへの自動更新は feed が乗っ取られた時点で任意
# コードが流れ込むため、署名導入と同時にしか入れられない。
#
# macOS 側は未署名の代償が Windows より重い: `identity: null` で作った `.app` は
# Big Sur / Apple Silicon 以降だと「壊れているため開けません」と出る（壊れていない —
# 署名の存在自体を要求されているだけ）。解除手順は desktop/README.md 側。ad-hoc 署名
# （`identity: "-"`）はビルドしたマシンでしか動かないので配布の答えにならない。
#
# 必要な Secrets（2 件・deploy-web.yml と同じものを流用。新規登録は不要）:
#   VITE_SUPABASE_URL      … Vite はビルド時に import.meta.env を文字列へ焼き
#   VITE_SUPABASE_ANON_KEY … 込むので、実行時ではなくビルド時に要る
# anon key がバンドルに載るのは仕様（公開前提の公開鍵で、実際の防御は RLS）。
# service_role key は絶対にここへ置かない（RLS を素通りする合鍵）。

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

# 配布の途中で止めると中途半端な Release が残りうるので、進行中はキャンセル
# しない（deploy-web.yml と同じ判断）
concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 片方の OS が落ちても、もう片方の成果物は見たい（切り分けのため）
      fail-fast: false
      matrix:
        include:
          - label: windows (nsis x64)
            os: windows-latest
            target: --win
            artifact: desktop-windows
            glob: desktop/release/*.exe
          # macos-latest は arm64 ランナ。arm64 の dmg はその場で起動を
          # 確かめられる側だが、x64 はクロスビルドになるので
          # ランナ上では一度も起動できない。判断キュー
          # D-20260830-main-1 の「放置時」に従い、両方ビルドしつつ
          # **Release に載せるのは arm64 だけ**、x64 は artifact に留める
          - label: macos (dmg arm64 + x64)
            os: macos-latest
            target: --mac
            artifact: desktop-macos
            glob: desktop/release/*-arm64.dmg
            extra_glob: desktop/release/*-x64.dmg
    steps:
      - uses: actions/checkout@v4

      # Release 名を決めるのはタグだが、成果物のファイル名を決めるのは
      # desktop/package.json（electron-builder.yml の artifactName が
      # ${version} を展開する）。この 2 つを揃える仕組みが無いので、版を
      # 上げ忘れたままタグを打つと「desktop-v0.2.0 という Release の中身は
      # Life Editor-0.1.0-x64-setup.exe」という取り違えが黙って通る。
      # desktop/README.md は文章で注意しているだけなので、ランナに守らせる。
      #
      # パッケージング（約 5 分）の前に置いてある — 打ち直せば済む間違いに
      # ビルド 2 OS 分を払わせない。node は GitHub ランナに標準で入っている
      # ため setup-node より前でも動く。
      - name: tag matches desktop/package.json version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          set -euo pipefail
          declared=$(node -p "require('./desktop/package.json').version")
          tagged="${GITHUB_REF_NAME#desktop-v}"
          if [ "$declared" != "$tagged" ]; then
            echo "::error::tag $GITHUB_REF_NAME asks for version $tagged but desktop/package.json declares $declared — bump the package first, then re-cut the tag"
            exit 1
          fi
          echo "tag and package.json agree on $declared"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            shared/package-lock.json
            web/package-lock.json
            desktop/package-lock.json

      # ci.yml の verify ジョブと同じ順序（shared → web → desktop）。
      # desktop の renderer root は ../web なので、web の node_modules が
      # 無いと renderer の依存（react / tiptap / supabase）が解決できない。
      - name: shared — install
        run: npm ci
        working-directory: shared
      - name: shared — build (tsc -b)
        run: npm run build
        working-directory: shared

      # web は install だけ。ここで欲しいのは node_modules であって
      # web/dist ではない（renderer は desktop 側で bundle し直す）
      - name: web — install
        run: npm ci
        working-directory: web

      - name: desktop — install
        run: npm ci
        working-directory: desktop

      - name: desktop — build (electron-vite build)
        run: npm run build
        working-directory: desktop
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # 中身が空のインストーラを配らないためのガード（deploy-web.yml の
      # "verify build output" と同じ思想）。env が抜けたままでもビルドは
      # 成功するので、ここを置かないと「見た目は正常なインストーラができて、
      # 入れた人の画面だけが真っ白」になる。
      #
      # 汎用文字列（"supabase.co" 等）では判定にならない — supabase-js 側の
      # 文字列に当たって env が空でも緑になりうるため、Secrets に入っている
      # 実際のホスト名がバンドルに焼けていることを見る。grep -q は一致内容を
      # 出力しないので、ホスト名がログに漏れることはない。
      #
      # windows-latest の既定シェルは pwsh なので bash を明示する。
      - name: verify renderer bundle is not empty
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          set -euo pipefail
          test -f desktop/out/main/index.js
          test -f desktop/out/preload/index.js
          test -f desktop/out/renderer/index.html
          if [ -z "${VITE_SUPABASE_URL:-}" ]; then
            echo "::error::VITE_SUPABASE_URL is empty — the repository secret is missing, so the installer would ship an app that cannot reach Supabase"
            exit 1
          fi
          host="${VITE_SUPABASE_URL#*://}"
          host="${host%%/*}"
          if ! grep -rqF "$host" desktop/out/renderer/assets/; then
            echo "::error::the renderer bundle does not contain the configured Supabase host — VITE_SUPABASE_URL did not reach Vite at build time"
            exit 1
          fi
          echo "renderer bundle carries the configured Supabase host"

      # --publish never: Release への添付は下の release ジョブが一括で行う。
      # 各 OS のジョブに publish させると 2 ジョブが同じ draft を取り合って
      # 壊れる（計画書の代替案表を参照）
      - name: desktop — package (electron-builder)
        run: npx electron-builder ${{ matrix.target }} --publish never
        working-directory: desktop

      - name: upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
          retention-days: 14

      # 受け入れ対象外の成果物。名前が `desktop-` で始まらないので
      # 下の release ジョブの pattern に拾われず、Release には乗らない。
      # 落として試したいときは Actions の run 画面から直接取る
      - name: upload unverified extras
        if: matrix.extra_glob != ''
        uses: actions/upload-artifact@v4
        with:
          name: unverified-${{ matrix.artifact }}-x64
          path: ${{ matrix.extra_glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: draft GitHub Release
    needs: build
    # workflow_dispatch（タグ無し）では Release を作らない。版を決める材料が
    # 無いまま draft を量産しても混乱するだけなので、手動実行はビルド確認まで
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # `desktop-*` だけを拾う。`unverified-*` は意図的に外している
      # （ランナで一度も起動できない x64 dmg）
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      # build ジョブ側の「空ビルドを配らない」ガードと対になる、集約側の検査。
      # 向こうは 1 つの bundle の中身を見るが、こちらは Release に載る**集合**
      # が揃っているかを見る。`gh release create dist/*` は渡された物をそのまま
      # 添付するだけなので、artifact が片方欠けても「アセット 1 個の Release」
      # が普通に出来上がってしまう — draft とはいえ、気付くのは配った後になる。
      #
      # 1 MB 判定は雑に見えて実務的: Electron のインストーラは最小構成でも
      # 数十 MB あるので、これを下回る物が混ざったら中身が空という意味になる。
      # 単位は必ずバイト（`c`）で書く — `-size -1M` は 1 MB 単位に**切り上げ**
      # てから比較するため、2 KB のファイルすら「1 単位」に丸められて素通り
      # する（ローカルで 2 KB の偽 dmg を置いて実測）。
      - name: verify the collected asset set
        run: |
          set -euo pipefail
          ls -la dist
          exe=$(find dist -maxdepth 1 -type f -name '*-x64-setup.exe' | wc -l)
          dmg=$(find dist -maxdepth 1 -type f -name '*-arm64.dmg' | wc -l)
          if [ "$exe" -ne 1 ] || [ "$dmg" -ne 1 ]; then
            echo "::error::expected 1 NSIS installer and 1 arm64 dmg, collected exe=$exe dmg=$dmg"
            exit 1
          fi
          if find dist -maxdepth 1 -type f -size -1000000c | grep -q .; then
            echo "::error::a collected asset is under 1 MB — no Electron installer is that small, so one of them is empty"
            find dist -maxdepth 1 -type f -size -1000000c -exec ls -la {} +
            exit 1
          fi
          echo "collected 1 NSIS installer and 1 arm64 dmg, both full size"

      # draft で作る（P-001 と同じ考え方 — 外に出す最後の一押しは人が押す）。
      # 公開は GitHub UI の "Publish release"、もしくは
      #   gh release edit <tag> --draft=false
      - name: create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Life Editor $GITHUB_REF_NAME" \
            --notes "未署名ビルドです。初回起動では OS の警告（Windows = SmartScreen / macOS = Gatekeeper）が出ます — 解除手順はリポジトリの desktop/README.md 「Installing an unsigned build」を見てください。" \
            dist/*
