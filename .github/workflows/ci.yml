name: CI — live stack (shared + web + desktop + mcp-server)

# 生きている本流（shared → web → desktop → mcp-server）の型検査・テスト・ビルドを
# 自動検証する。
# 旧 Tauri スタック（frontend/ + src-tauri/ + 旧 build.yml）は 2026-07-11 に削除済み
# （#197・復元 = git tag pre-tauri-removal）。Phase 4 の mobile は未着手のため当面
# ここには含めない。desktop は typecheck + electron-vite build まで（#529 —
# electron-builder のフルパッケージングは NSIS が Linux ランナーで動かず、
# OS 別ランナーは CI 分数コストに見合わないため回さない）。
#
# 検証済みの手順をそのまま写したもの（2026-06-20 ローカル実測: shared 491 tests 緑 /
# web vite build 緑）。手元で再現するには ai-context.md §6 のコマンドを参照。

on:
  pull_request:
  push:
    branches: [main]

# 同一ブランチで新しい push が来たら古い実行はキャンセル（無駄な並走を防ぐ）
concurrency:
  group: ci-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # docs 整合の機械検査（#173）。検査内容の正本 = scripts/docs-lint.sh
  # （相対リンク実在 / 旧トークン残存 / plans Status enum / 完了プラン残置）
  docs-lint:
    name: docs-lint (.claude docs consistency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run docs-lint
        run: bash scripts/docs-lint.sh

  verify:
    name: typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            shared/package-lock.json
            web/package-lock.json
            desktop/package-lock.json
            mcp-server/package-lock.json

      # shared = React コード本体: 型検査(tsc -b) + vitest
      - name: shared — install
        run: npm ci
        working-directory: shared
      # web と同じ理由でここ（verify 内のステップ）に置く。独立ジョブにすると
      # npm ci がもう一度走る分だけ遅くなる（#364 / #421）
      - name: shared — lint (eslint)
        run: npm run lint
        working-directory: shared
      - name: shared — build (tsc -b)
        run: npm run build
        working-directory: shared
      # tests/ は tsconfig.json の include の外（あの project は dist/ を emit する
      # ので suites を同梱できない）。そのため専用 config で型検査する（#668 C1）。
      # 導入時点で 12 suites / 15 errors が落ちたので、tsconfig.test.json 側に
      # eslint baseline と同じ「縮んでいく除外リスト」を持たせた上でブロッキング
      # にしている。除外の外にある約 180 suites は今日から検査される
      - name: shared — typecheck tests (tsc -p tsconfig.test.json)
        run: npm run typecheck:tests
        working-directory: shared
      - name: shared — test (vitest)
        run: npm run test
        working-directory: shared

      # web = ブラウザ renderer: 型検査(tsc -b --force) + vite build
      # 上で shared を build 済み・node_modules 導入済みのため web から参照解決できる
      - name: web — install
        run: npm ci
        working-directory: web
      # lint はここ（verify 内のステップ）に置く。独立ジョブにすると npm ci が
      # もう一度走る分だけ遅くなるため（#364）
      - name: web — lint (eslint)
        run: npm run lint
        working-directory: web
      - name: web — build (tsc -b --force && vite build)
        run: npm run build
        working-directory: web
      # shared と同じ穴を塞ぐ（#668 C1）。型解決が ../shared/dist 経由なので、
      # 直前の web — build（tsc -b --force が shared も建て直す）より後に置く。
      # 落ちたのは 24 suites 中 1 本だけで、それが tsconfig.test.json の除外リスト
      - name: web — typecheck tests (tsc -p tsconfig.test.json)
        run: npm run typecheck:tests
        working-directory: web
      # web = renderer 側の vitest（#475 で追加）。vitest.config.ts は vite.config.ts
      # を merge するので @life-editor/shared は ../shared/src から解決される
      # （shared の dist 不要・web/node_modules だけで完結する）
      - name: web — test (vitest)
        run: npm run test
        working-directory: web

      # desktop = Electron 殻（#529 で追加）: 型検査 + vitest + electron-vite
      # build。renderer root は ../web なので上の web — install が前提
      # （web/node_modules から renderer 依存を解決する）。electron-builder
      # パッケージングは回さない（理由はファイル冒頭コメント）。
      # test は #894 で追加: 型検査と build はどちらも「main と preload が同じ
      # チャネル名を使っているか」を見られない（文字列リテラル同士で型が繋がら
      # ないため、片方だけ改名しても両方通る）。tests/ipcContract.test.ts が
      # ../../shared/src の型を直 import している点は mcp-server と同じ意図的な
      # 結合で、authStorage の署名がどちらかで動いたら typecheck が落ちる。
      - name: desktop — install
        run: npm ci
        working-directory: desktop
      - name: desktop — typecheck
        run: npm run typecheck
        working-directory: desktop
      - name: desktop — test (vitest)
        run: npm run test
        working-directory: desktop
      - name: desktop — build (electron-vite build)
        run: npm run build
        working-directory: desktop

      # mcp-server = 独立 Node プロセス（#668 C1）。ここに来るまで src は一度も
      # 型検査されず、vitest も CI で一度も走っていなかった。lint は足さない
      # （このパッケージに eslint 設定が無く、導入は別作業）。
      # tests/briefingSection.test.ts が ../../shared/src を直 import している
      # ため、この 3 ステップは shared を壊すと連鎖して落ちる — 意図した結合で、
      # 朝刊の parseDoc 受理条件が shared と mcp で割れている（C10）ことを CI に
      # 見張らせる唯一の場所になる。shared — install が上で済んでいるのが前提。
      - name: mcp-server — install
        run: npm ci
        working-directory: mcp-server
      - name: mcp-server — build (tsc)
        run: npm run build
        working-directory: mcp-server
      # vitest.config.ts が TZ を Asia/Tokyo に pin する。ランナーは UTC なので、
      # pin が無いと localDate の局所日付テストが別の意味で緑になる（実測: pin を
      # 外すと UTC で 2 件落ちる）
      - name: mcp-server — test (vitest)
        run: npm run test
        working-directory: mcp-server
