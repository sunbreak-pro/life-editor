name: Deploy — Remote MCP to Cloudflare Workers

# life-editor の MCP ツールを Cloudflare Workers に配る。配る先は 2 つあり、
# 手動実行の入力 target で選ぶ（既定 = phone）:
#
#   phone   … スマホの Claude アプリのカスタムコネクタが繋ぐ Remote MCP
#             （wrangler.jsonc → dist/worker.js）。
#             設計・手順の正本 = .claude/archive/2026-09-09-remote-mcp-mobile.md
#   gateway … 別リポジトリの拡張アプリが繋ぐ専用の窓口 life-editor-gateway
#             （wrangler.gateway.jsonc → dist/gatewayWorker.js）。
#             設計・手順の正本 = .claude/docs/vision/plans/2026-10-07-extension-app-gateway.md
#
# 2 つは鍵・CORS・取り消しを分けるための別 Worker で、同じ dist/ から
# 別のエントリを配る。手元から配る npm run deploy / deploy:gateway と同じ中身。
#
# deploy-web.yml（公開 Web URL）とは別 Worker・別ファイル。あちらは静的アセット
# 配信で main への push で自動配布するが、こちらは push では走らせない:
#
#   - 配る先が「オーナーの生データを読み書きできる公開エンドポイント」で、
#     Plan Gate の 🛑 人手（本番デプロイ）に当たる（CLAUDE.md §7.3）
#   - Worker 側のシークレット（下記）が入っていないと、デプロイは成功
#     するのにツール呼び出しが全部エラーになる。投入は wrangler secret put で
#     一度だけ手で行う作業なので、その前に自動で配っても意味がない
#
# 必要な GitHub Secrets（deploy-web.yml と共用）:
#   CLOUDFLARE_API_TOKEN … テンプレート「Edit Cloudflare Workers」で発行
#   CLOUDFLARE_ACCOUNT_ID
#
# Worker 側のシークレットは GitHub ではなく Cloudflare に置き、ローカルから
# 1 本ずつ投入する。2 つの Worker は別々に持つので、片方に入れても
# もう片方には入らない。
#
#   phone … cd mcp-server && npx wrangler@4 secret put <NAME>
#     LIFE_EDITOR_MCP_TOKEN / LIFE_EDITOR_SUPABASE_URL /
#     LIFE_EDITOR_SUPABASE_ANON_KEY / LIFE_EDITOR_SUPABASE_EMAIL /
#     LIFE_EDITOR_SUPABASE_PASSWORD
#
#   gateway … cd mcp-server && npx wrangler@4 secret put <NAME> -c wrangler.gateway.jsonc
#     LIFE_EDITOR_GATEWAY_APPS / LIFE_EDITOR_GATEWAY_SESSION_SECRET /
#     LIFE_EDITOR_SUPABASE_URL / LIFE_EDITOR_SUPABASE_ANON_KEY /
#     LIFE_EDITOR_SUPABASE_EMAIL / LIFE_EDITOR_SUPABASE_PASSWORD /
#     LIFE_EDITOR_REVIEW_SUPABASE_EMAIL / LIFE_EDITOR_REVIEW_SUPABASE_PASSWORD
#     各シークレットの意味の正本 = mcp-server/wrangler.gateway.jsonc のコメント。
#     -c を付け忘れると phone 側の Worker に入ってしまう。
#
# どちらも anon key 止まりで service_role key は絶対に置かない（RLS を素通りする合鍵）。

on:
  workflow_dispatch:
    inputs:
      target:
        description: "配る先（phone = スマホのコネクタ用 Remote MCP / gateway = 拡張アプリ用の窓口）"
        type: choice
        options:
          - phone
          - gateway
        default: phone

# 2 つの Worker は別物なので、同じ先への配布だけを直列にする
concurrency:
  group: deploy-mcp-${{ inputs.target || 'phone' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: build + deploy (${{ inputs.target || 'phone' }})
    runs-on: ubuntu-latest
    # 入力なしの実行（gh workflow run で -f を省いたとき等）でも phone に倒す
    env:
      TARGET: ${{ inputs.target || 'phone' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mcp-server/package-lock.json

      - name: mcp-server — install
        run: npm ci
        working-directory: mcp-server

      # wrangler.jsonc の main は dist/worker.js、wrangler.gateway.jsonc の main は
      # dist/gatewayWorker.js を指す（相対 import が Node16 の
      # .js 拡張子付きで、wrangler の esbuild はそれを .ts へ読み替えないため）。
      # tsc を先に通すのは省略できない手順で、飛ばすと "main not found" で落ちる。
      - name: mcp-server — build (tsc)
        run: npm run build
        working-directory: mcp-server

      # 配る前に、配る対象が実在することだけ確かめる（ci.yml が型とテストを
      # 見ているので、ここでの検査はビルド成果物の有無に絞る）
      - name: verify build output (phone)
        if: env.TARGET == 'phone'
        run: test -f mcp-server/dist/worker.js

      - name: verify build output (gateway)
        if: env.TARGET == 'gateway'
        run: test -f mcp-server/dist/gatewayWorker.js

      - name: deploy to Cloudflare Workers (phone)
        if: env.TARGET == 'phone'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: mcp-server
          command: deploy

      - name: deploy to Cloudflare Workers (gateway)
        if: env.TARGET == 'gateway'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: mcp-server
          command: deploy -c wrangler.gateway.jsonc
