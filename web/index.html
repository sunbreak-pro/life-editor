<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      viewport-fit=cover (#320): required for env(safe-area-inset-*) to resolve
      to non-zero on notched iOS inside the Capacitor shell (BottomTabBar /
      MobileDrawer / AppShell padding). No-op on desktop browsers / Electron.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!--
      PWA metadata (#600). Scope is deliberately narrow: a home-screen icon and
      standalone (chrome-less) display for the public Web URL. NO service
      worker / offline cache — that stays a Non-goal (migration SSOT §9), so
      there is no stale-bundle class of bug to reason about here.

      Both the manifest and the Apple-specific tags are needed: iOS Safari
      still honours `apple-mobile-web-app-*` + `apple-touch-icon` rather than
      reading them off the manifest.

      `mobile-web-app-capable` and its `apple-` twin are likewise both needed,
      not either/or (#947): Chrome reads the standard name only and logs a
      deprecation warning when it finds just the Apple one, while iOS Safari
      reads only the Apple one. Dropping either side loses a platform.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Life Editor" />
    <!--
      Was `black-translucent`, which let the app paint under the status bar
      (#320 / #805). The catch (#1009): that value also pins the status bar's
      clock, signal and battery to WHITE, whatever colour is behind them. On 朝刊
      (`#fbf4e8`, cream) they are white-on-cream and effectively unreadable —
      #791's screenshot was taken at 23:14, i.e. 夕刊, which is why it never
      showed.

      There is no theme-aware option to reach for. iOS reads this meta ONCE at
      launch (rewriting it later does nothing) and ignores `theme-color` and the
      manifest's `theme_color` for the status bar entirely, so its only choices
      are these three fixed values. `default` is the one that stays legible in
      both editions; the cost is that 夕刊 gets a light strip along the top
      instead of a continuous surface.

      Consequences elsewhere, both self-cancelling — no code change needed:
        - the web view now starts BELOW the status bar, so
          env(safe-area-inset-top) is 0 and AppShell's `pt-` (#805) collapses;
        - the same 0 disables the standalone height correction in
          shared/src/styles/tokens.css (#1037), whose bug was black-translucent's
          upward shift in the first place.

      `viewport-fit=cover` above still earns its keep: the left/right insets and
      the home indicator are unaffected by this value.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!--
      Status-bar tint per theme. Values are the resolved `--color-bg-primary`
      of each theme (朝刊 / 夕刊 — shared/src/styles/tokens.css). Hardcoded
      because <meta> cannot read CSS custom properties; these two literals and
      the manifest's colors are the only sanctioned exceptions to the
      "no hardcoded colors" rule (CLAUDE.md §6).
    -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#fbf4e8"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#101a2c"
    />
    <title>Life Editor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
