<!-- @dsCard group="Components" -->
<!doctype html><html lang='en'><head><meta charset='utf-8'><style>
:root{--bg:#fbf4e8;--bg-2:#f5ebda;--text:#2b2015;--text-2:#6b5a45;--border:#eadec6;--border-strong:#d6c3a2;--hover:#f0e5d0;--accent:#ad4409;--success:#0f7b6c;--danger:#d92d20;--info:#2563eb;--shadow-md:0 2px 8px -1px rgb(15 23 42 / 0.1),0 1px 3px -1px rgb(15 23 42 / 0.06);--font:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,'Apple Color Emoji',Arial,sans-serif,'Segoe UI Emoji','Segoe UI Symbol'}
*{box-sizing:border-box} body{margin:0;padding:28px;background:var(--bg-2);color:var(--text);font-family:var(--font)}
h1{font-size:15px;font-weight:600;margin:0 0 4px} p.sub{margin:0 0 22px;color:var(--text-2);font-size:12px}
.stack{display:flex;flex-direction:column;gap:14px;max-width:320px}
.row{display:flex;flex-direction:column;gap:5px}
.label{font-size:11px;font-weight:500;color:var(--text-2);letter-spacing:.02em;text-transform:uppercase}
.toast{position:relative;display:flex;align-items:center;gap:9px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:11px 12px 11px 14px;box-shadow:var(--shadow-md);overflow:hidden}
.toast::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:12px 0 0 12px}
.t-success::before{background:var(--success)} .t-danger::before{background:var(--danger)} .t-info::before{background:var(--info)}
.dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%}
.t-success .dot{background:var(--success)} .t-danger .dot{background:var(--danger)} .t-info .dot{background:var(--info)}
.msg{flex:1;font-size:13px;line-height:1.35;color:var(--text)}
.x{flex:0 0 auto;width:20px;height:20px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;border-radius:6px;color:var(--text-2);font-size:13px;line-height:1;cursor:pointer}
.x:hover{background:var(--hover);color:var(--text)}
</style></head><body>
<h1>Toast</h1><p class='sub'>Opaque notification cards · 3px accent bar + status dot · success / danger / info · radius-lumen-lg · shadow-elevation-md · dismissible</p>
<div class='stack'>
<div class='row'><span class='label'>Success</span>
<div class='toast t-success'><span class='dot'></span><span class='msg'>Note saved to Materials.</span><button class='x' aria-label='Dismiss'>✕</button></div></div>
<div class='row'><span class='label'>Danger</span>
<div class='toast t-danger'><span class='dot'></span><span class='msg'>Sync failed — changes kept locally.</span><button class='x' aria-label='Dismiss'>✕</button></div></div>
<div class='row'><span class='label'>Info</span>
<div class='toast t-info'><span class='dot'></span><span class='msg'>3 tasks moved to today.</span><button class='x' aria-label='Dismiss'>✕</button></div></div>
</div>
</body></html>
