<!-- @dsCard group="Components" -->
<!doctype html><html lang='en'><head><meta charset='utf-8'><style>
:root{
--bg:#fbf4e8;--page:#f5ebda;--text:#2b2015;--text-2:#6b5a45;
--border:#eadec6;--border-strong:#d6c3a2;
--accent:#ad4409;--accent-hover:#8f3807;--on-accent:#ffffff;
--shadow-lg:0 14px 34px -10px rgb(15 23 42 / 0.2),0 4px 10px -4px rgb(15 23 42 / 0.1);
--font:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,'Apple Color Emoji',Arial,sans-serif,'Segoe UI Emoji','Segoe UI Symbol'}
*{box-sizing:border-box}
body{margin:0;padding:28px;background:var(--page);color:var(--text);font-family:var(--font)}
h1{font-size:15px;font-weight:600;margin:0 0 4px}
p.sub{margin:0 0 22px;color:var(--text-2);font-size:12px}
.phone{position:relative;width:280px;height:460px;border-radius:20px;border:1px solid var(--border-strong);background:var(--bg);overflow:hidden}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--border);border-radius:12px 12px 0 0;box-shadow:var(--shadow-lg);padding:10px 16px 18px}
.grabber{width:38px;height:4px;border-radius:9999px;background:var(--border-strong);margin:2px auto 14px}
.title{font-size:14px;font-weight:600;margin:0 0 12px}
.row{display:flex;align-items:center;justify-content:space-between;height:42px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text)}
.row:last-of-type{border-bottom:none}
.chev{color:var(--text-2);font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:42px;margin-top:14px;border:none;border-radius:8px;background:var(--accent);color:var(--on-accent);font-size:14px;font-weight:600;cursor:pointer}
</style></head><body>
<h1>Mobile Bottom Sheet</h1>
<p class='sub'>Opaque sheet over dimmed body · grabber · list rows · full-width accent action · radius-lumen-lg top · shadow-elevation-lg</p>
<div class='phone'>
<div class='dim'></div>
<div class='sheet'>
<div class='grabber'></div>
<p class='title'>Add to schedule</p>
<div class='row'><span>Set date</span><span class='chev'>›</span></div>
<div class='row'><span>Add reminder</span><span class='chev'>›</span></div>
<div class='row'><span>Assign tags</span><span class='chev'>›</span></div>
<button class='btn'>Create</button>
</div>
</div>
</body></html>
